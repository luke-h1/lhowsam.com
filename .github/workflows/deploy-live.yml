name: Deploy to Production
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'dev'
        type: string

env:
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    name: Deploy to live
    concurrency:
      group: deploy-live-${{ inputs.branch }}
      cancel-in-progress: false
    outputs:
      next-version: ${{ steps.version.outputs.next }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Load secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ env.OP_SERVICE_ACCOUNT_TOKEN }}
          PUBLIC_URL: op://ci-cd/lhowsam-prod/PUBLIC_URL
          VERCEL_PROJECT_ID: op://ci-cd/lhowsam-prod/VERCEL_PROJECT_ID
          VERCEL_TOKEN: op://ci-cd/lhowsam-prod/VERCEL_TOKEN
          VERCEL_ORG_ID: op://ci-cd/lhowsam-prod/VERCEL_ORG_ID
          SENTRY_ORG: op://ci-cd/lhowsam-prod/SENTRY_ORG
          SENTRY_PROJECT: op://ci-cd/lhowsam-prod/SENTRY_PROJECT
          SENTRY_AUTH_TOKEN: op://ci-cd/lhowsam-prod/SENTRY_AUTH_TOKEN
          PUBLIC_SENTRY_DSN: op://ci-cd/lhowsam-prod/PUBLIC_SENTRY_DSN
          PUBLIC_POSTHOG_KEY: op://ci-cd/lhowsam-prod/PUBLIC_POSTHOG_KEY
          PUBLIC_NOW_PLAYING_API_BASE_URL: op://ci-cd/lhowsam-prod/PUBLIC_NOW_PLAYING_API_BASE_URL
          PUBLIC_NOW_PLAYING_API_KEY: op://ci-cd/lhowsam-prod/PUBLIC_NOW_PLAYING_API_KEY

      - name: install
        uses: ./.github/actions/install

      - name: Pick the next version from the changesets
        id: version
        run: |
          set -euo pipefail
          CURRENT="$(jq -r .version package.json)"
          NEXT="$(bun scripts/release-notes.ts next-version --current "$CURRENT")"
          if [ -z "$NEXT" ]; then
            echo "No changeset with a bump is waiting since ${CURRENT}; the build reports ${CURRENT}"
          else
            echo "The build reports ${NEXT}; the release job cuts it after the deploy"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_APP_VERSION=${NEXT:-$CURRENT}" >> "$GITHUB_ENV"

      - name: Build
        uses: ./.github/actions/build

      - name: Deploy to live
        uses: ./.github/actions/deploy
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          environment: prod

      - name: prod UI tests
        uses: ./.github/actions/ui-test
        with:
          target: e2e:prod

  release:
    runs-on: ubuntu-latest
    name: Release
    needs: deploy-live
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: install
        uses: ./.github/actions/install

      - name: Recover a release that a failed run left without a GitHub release
        id: recover
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT="$(jq -r .version package.json)"
          if git rev-parse -q --verify "refs/tags/v${CURRENT}" >/dev/null && ! gh release view "v${CURRENT}" >/dev/null 2>&1; then
            echo "v${CURRENT} is tagged but has no GitHub release; creating it"
            bun scripts/release-notes.ts show --version "$CURRENT" > "$RUNNER_TEMP/release-notes.md"
            gh release create "v${CURRENT}" --title "v${CURRENT}" --notes-file "$RUNNER_TEMP/release-notes.md"
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          else
            echo "recovered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cut CHANGELOG.md, tag and release
        if: steps.recover.outputs.recovered == 'false' && needs.deploy-live.outputs.next-version != ''
        env:
          BRANCH: ${{ inputs.branch }}
          NEXT: ${{ needs.deploy-live.outputs.next-version }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/release-notes.ts release --version "$NEXT" > "$RUNNER_TEMP/release-notes.md"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.NEXT;
            fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          '
          git config user.name "luke-h1"
          git config user.email "55030296+luke-h1@users.noreply.github.com"
          git add CHANGELOG.md .changeset package.json
          git commit -m "chore(changelog): release ${NEXT} [skip ci]"
          git tag -a "v${NEXT}" -m "v${NEXT}"
          AUTH_HEADER="$(printf 'luke-h1:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push --atomic "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}" "refs/tags/v${NEXT}"
          gh release create "v${NEXT}" --title "v${NEXT}" --notes-file "$RUNNER_TEMP/release-notes.md"
