name: Changesets
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changeset-status:
    name: Changeset present
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install
        uses: ./.github/actions/install

      - name: Check the pull request has a changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bun run changeset -- status --since="origin/${BASE_REF}"
