name: Build
on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '*.md'
      - '.changeset/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Label pull request
        uses: actions/labeler@v5
        with:
          sync-labels: true

      - name: Load secrets
        if: github.actor != 'dependabot[bot]'
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ env.OP_SERVICE_ACCOUNT_TOKEN }}
          SENTRY_ORG: op://ci-cd/lhowsam-dev/SENTRY_ORG
          SENTRY_PROJECT: op://ci-cd/lhowsam-dev/SENTRY_PROJECT
          SENTRY_AUTH_TOKEN: op://ci-cd/lhowsam-dev/SENTRY_AUTH_TOKEN
          PUBLIC_SENTRY_DSN: op://ci-cd/lhowsam-dev/PUBLIC_SENTRY_DSN
          PUBLIC_URL: op://ci-cd/lhowsam-dev/PUBLIC_URL

      - name: install
        uses: ./.github/actions/install

      - name: Build frontend
        uses: ./.github/actions/build
        with:
          test-script: test:coverage

      - name: Download base branch coverage summary
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: vitest-coverage.yml
          branch: ${{ github.event.pull_request.base.ref }}
          name: vitest-coverage-summary
          path: coverage/base

      - name: Report coverage
        if: github.actor != 'dependabot[bot]'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: test-coverage
          json-summary-compare-path: ${{ hashFiles('coverage/base/coverage-summary.json') != '' && 'coverage/base/coverage-summary.json' || '' }}
