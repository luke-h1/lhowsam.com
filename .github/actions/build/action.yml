name: 'Build frontend'
description: 'Build frontend app'
runs:
  using: 'composite'
  steps:
      - name: Ensure rebased with dev 
        shell: bash
        run: ./scripts/ensure-rebased.sh

      - name: prettier:check
        run: pnpm exec turbo run prettier:check
        shell: bash

      - name: lint
        run: pnpm exec turbo run lint
        shell: bash

      - name: jest
        run: pnpm exec turbo run test:ci
        shell: bash

      - name: ts:check
        run: pnpm exec turbo run ts:check
        shell: bash

      - name: build
        run: pnpm exec turbo run build
        shell: bash

      - name: local UI tests
        uses: ./.github/actions/ui-test
        with:
          target: e2e-local
