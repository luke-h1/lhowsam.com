name: 'Build frontend'
description: 'Build frontend'
runs:
  using: 'composite'
  steps:
      - name: prettier:check
        run: bun run prettier:check
        shell: bash

      - name: lint
        run: bun run lint
        shell: bash

      - name: test
        run: bun run test
        shell: bash

      - name: ts:check
        run: bun run ts:check
        shell: bash

      - name: build
        run: bun run build
        shell: bash

      - name: local UI tests
        uses: ./.github/actions/ui-test
        with:
          target: e2e-local
